    <title>Bhavya Mehta | Full Stack Developer</title>
    <script>
      (function () {
        try {
          /* Default = light. Only go dark if user previously chose dark. */
          var saved = localStorage.getItem('portfolio_theme');
          var isDark = saved === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0B0B0D' : '#FAFAFA');
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
